{% extends 'blog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for publications in object_list %}
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{ publications.photo | media_filter }}">
            <div class="card-body">
              <p class="card-text">{{ publications.title }}</p>
              <p class="card-text">{{ publications.description | truncatechars:100 }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-primary" href="{% url 'blog:publications_detail' publications.id %}" role="button">Посмотреть</a>
                </div>
                <small class="text-body-secondary">9 mins</small>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
  </div>
{% endblock %}
